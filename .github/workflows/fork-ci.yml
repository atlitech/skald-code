name: Fork CI

# Fork tests remain relative to the upstream merge base. Check is the required
# aggregate for branch protection and releases; every lane must succeed.
# Runbook: docs/operations/fork-server.md.

on:
  pull_request:
    branches:
      - atli
  push:
    branches:
      - atli
  workflow_dispatch:
    inputs:
      runner-profile:
        description: Runner profile for same-ref timing comparisons
        type: choice
        options: [blacksmith, github]
        default: blacksmith
      use-cache:
        description: Restore and save test/typecheck results (dependency caches stay enabled)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}-${{ inputs.runner-profile }}-${{ inputs.use-cache }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GH_TOKEN: ${{ github.token }}
  VP_REMOTE_CACHE: "off"
  VP_REMOTE_CACHE_URL: ""

jobs:
  static:
    name: Static checks
    if: github.repository_id == '1406026313'
    runs-on: ${{ inputs.runner-profile == 'github' && 'ubuntu-24.04' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Restore task results
        id: task_cache
        if: github.event_name != 'workflow_dispatch' || inputs.use-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: fork-vite-task-v1-ubuntu-2404-${{ runner.arch }}-${{ inputs.runner-profile == 'github' && 'github' || 'blacksmith' }}-static-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-${{ github.sha }}
          restore-keys: |
            fork-vite-task-v1-ubuntu-2404-${{ runner.arch }}-${{ inputs.runner-profile == 'github' && 'github' || 'blacksmith' }}-static-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-

      - name: Lint and format
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Save task results
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.use-cache) && steps.task_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task_cache.outputs.cache-primary-key }}

  tests:
    name: Fork tests
    if: github.repository_id == '1406026313'
    runs-on: ${{ inputs.runner-profile == 'github' && 'ubuntu-24.04' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          dependencies=$(ldd "$browser")
          if grep -q '=> not found' <<< "$dependencies"; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Verify upstream and run non-server fork tests
        run: node scripts/fork-check.ts --suite other

  server:
    name: Server tests ${{ matrix.shard }}/2
    if: github.repository_id == '1406026313'
    runs-on: ${{ inputs.runner-profile == 'github' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          dependencies=$(ldd "$browser")
          if grep -q '=> not found' <<< "$dependencies"; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Restore task results
        id: task_cache
        if: github.event_name != 'workflow_dispatch' || inputs.use-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: fork-vite-task-v1-ubuntu-2404-${{ runner.arch }}-${{ inputs.runner-profile == 'github' && 'github' || 'blacksmith' }}-server-${{ matrix.shard }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-${{ github.sha }}
          restore-keys: |
            fork-vite-task-v1-ubuntu-2404-${{ runner.arch }}-${{ inputs.runner-profile == 'github' && 'github' || 'blacksmith' }}-server-${{ matrix.shard }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-

      - name: Verify upstream and run the isolated server shard
        run: node scripts/fork-check.ts --suite server --shard ${{ matrix.shard }}/2 --cache-server --report "${{ runner.temp }}/test-cache-${{ matrix.shard }}.json"

      - name: Upload cache measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-cache-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-cache-${{ matrix.shard }}.json
          if-no-files-found: warn

      - name: Save task results
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.use-cache) && steps.task_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task_cache.outputs.cache-primary-key }}

  check:
    name: Check
    if: ${{ always() && github.repository_id == '1406026313' }}
    needs: [static, tests, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI lane to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
