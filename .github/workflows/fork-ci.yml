name: Fork CI

# Fork-only (atlitech/t3code). The fork does not run upstream's CI (ci.yml is
# disabled here): upstream runs it on every upstream commit, and at that volume
# GitHub pauses a fork's Actions. `Check` confirms the upstream commit the
# branch builds on passed upstream's own `Check`, runs the tests the fork added
# or changed since that commit (scripts/fork-check.ts), then lints and
# typechecks everything. The atli ruleset requires `Check`, and
# fork-server-release.yml requires it on the commit it releases. Releases also
# run upstream's whole suite (fork-full-suite.yml).
# Runbook: docs/operations/fork-server.md.

on:
  pull_request:
    branches:
      - atli
  push:
    branches:
      - atli

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    if: github.repository == 'atlitech/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Commits without blobs: the fork check finds the upstream commit by merge-base.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # Web tests the fork changed may run in apps/web's headless Chromium project.
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      # --with-deps also downloads fonts, even when the runner has Chromium's libraries.
      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          dependencies=$(ldd "$browser")
          if grep -q '=> not found' <<< "$dependencies"; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Upstream passed its CI, and the fork's tests pass
        run: node scripts/fork-check.ts

      - name: Lint and format
        run: vp check

      - name: Typecheck
        run: vpr typecheck
