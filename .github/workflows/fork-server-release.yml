name: Fork server release

# Guarded manual releases retain Linux admission, Mac signing, and full tests.
# EAS compiles mobile; Android is verified before publication, OTA and iOS after.
# Runbook: docs/operations/fork-server.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fork version, <next upstream patch>-atli.<n> (for example 0.0.46-atli.1)"
        required: true
        type: string
      force-native:
        description: "Refresh a native installer even when OTA is compatible"
        type: choice
        options: [none, android, ios, all]
        default: none
      admission-bootstrap-prior:
        description: "First admission only: the earlier release (for example 0.0.46-atli.3) to upgrade from while no release carries ADMISSION.json. Leave empty otherwise."
        required: false
        default: ""
        type: string

concurrency:
  group: skald-production-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs before every build: the dispatch must come from atli, the version
  # must be unused, and the atli tip must have passed CI's Check job. Every
  # later job checks out the commit this job approved, not the moving branch.
  guard:
    name: Guard release
    if: github.repository_id == '1406026313'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      version: ${{ steps.guard.outputs.version }}
      tag: ${{ steps.guard.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require approved EAS cutover
        env:
          SKALD_EAS_READY: ${{ vars.SKALD_EAS_READY }}
        run: |
          if [ "$SKALD_EAS_READY" != true ]; then
            echo "::error::Complete managed signing, remote counter seeding, protected token setup, and the native/device pilot in the runbook before enabling EAS releases."
            exit 1
          fi

      - name: Require repository variables
        shell: bash
        env:
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: |
          set -euo pipefail
          missing=()
          for name in T3CODE_CLERK_PUBLISHABLE_KEY T3CODE_CLERK_JWT_TEMPLATE T3CODE_CLERK_CLI_OAUTH_CLIENT_ID T3CODE_RELAY_URL; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository variables: ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Check ref, version, and CI
        id: guard
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/fork-release-guard.ts --release-version "$RELEASE_VERSION"

  build-linux:
    name: Build Linux x64 server
    needs: guard
    if: github.repository_id == '1406026313'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      archive-sha256: ${{ steps.digest.outputs.sha256 }}
    env:
      # Public T3 Connect identifiers baked into the server and web bundles.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: resource-monitor-x86_64-unknown-linux-gnu-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      # t3#build builds @t3tools/web first and copies it into apps/server/dist/client.
      - name: Build server and web client
        run: vp run --filter t3 build

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build and smoke-test CLI archive
        shell: bash
        run: |
          set -euo pipefail
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor"
          mkdir -p "$monitor_dir/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$monitor_dir/linux-x64/"
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "$VERSION" \
            --resource-monitor-dir "$monitor_dir" \
            --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive "release-cli/t3-$VERSION-linux-x64.tar.gz" --expect-version "$VERSION"

      # admission refuses any archive whose sha256 is not this one.
      - name: Record archive digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(sha256sum "release-cli/t3-$VERSION-linux-x64.tar.gz" | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-cli/t3-${{ needs.guard.outputs.version }}-linux-x64.tar.gz

      # publish downloads every `release-*` artifact into one directory.
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: release-cli/t3-${{ needs.guard.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Builds the desktop DMG (Skald Code, tech.atli.skaldcode) on a GitHub-hosted
  # Apple silicon runner, signed with the owner's Developer ID certificate and
  # profile from the personal-macos-signing environment, which only atli may
  # deploy to, and notarized with an App Store Connect API key. Checked for its
  # identity, signature, and notarization ticket, never run here.
  build-mac:
    name: Build Mac arm64 desktop app
    needs: guard
    if: github.repository_id == '1406026313' && github.ref == 'refs/heads/atli'
    runs-on: macos-15
    environment: personal-macos-signing
    # Apple's first notarization for a new team can take several hours.
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # Public T3 Connect identifiers baked into the desktop, server, and web bundles.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
      T3CODE_DESKTOP_VERSION: ${{ needs.guard.outputs.version }}
      T3CODE_DESKTOP_SIGNED: "true"
      T3CODE_DESKTOP_UPDATE_REPOSITORY: atlitech/skald-code
      # The Developer ID profile's team; the build also signs passkey entitlements with it.
      T3CODE_APPLE_TEAM_ID: H6L3F33KRM
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # The desktop build compiles the bundled resource monitor from source.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      # The build reads the profile from T3CODE_MACOS_PROVISIONING_PROFILE and
      # electron-builder notarizes with the key file APPLE_API_KEY names.
      - name: Write the Developer ID profile and notarization key
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.T3CODE_PERSONAL_MACOS_CERTIFICATE_BASE64 }}
          PROFILE_BASE64: ${{ secrets.T3CODE_PERSONAL_MACOS_PROFILE_BASE64 }}
          API_KEY_BASE64: ${{ secrets.T3CODE_PERSONAL_MACOS_APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$PROFILE_BASE64" ] || [ -z "$API_KEY_BASE64" ]; then
            echo "::error::The personal-macos-signing environment lacks the Developer ID certificate, its profile, or the App Store Connect API key."
            exit 1
          fi
          printf '%s' "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/skald-code.provisionprofile"
          printf '%s' "$API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          security cms -D -i "$RUNNER_TEMP/skald-code.provisionprofile" > /dev/null
          echo "T3CODE_MACOS_PROVISIONING_PROFILE=$RUNNER_TEMP/skald-code.provisionprofile" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # The ZIP is Squirrel.Mac's signed update payload.
      - name: Build desktop DMG
        env:
          CSC_LINK: ${{ secrets.T3CODE_PERSONAL_MACOS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.T3CODE_PERSONAL_MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ vars.T3CODE_PERSONAL_MACOS_APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.T3CODE_PERSONAL_MACOS_APP_STORE_CONNECT_ISSUER_ID }}
        run: vp run dist:desktop:dmg:arm64

      - name: Check the app's bundle identifier, version, and signature
        shell: bash
        run: |
          set -euo pipefail
          mount_dir="$RUNNER_TEMP/dmg"
          mkdir -p "$mount_dir"
          hdiutil attach "release/T3-Code-$VERSION-arm64.dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          shopt -s nullglob
          apps=("$mount_dir"/*.app)
          if (( ${#apps[@]} != 1 )); then
            echo "::error::Expected one app in the DMG; found ${#apps[@]}."
            exit 1
          fi
          ditto -x -k "release/T3-Code-$VERSION-arm64.zip" "$RUNNER_TEMP/ota"
          ota_apps=("$RUNNER_TEMP/ota"/*.app)
          if (( ${#ota_apps[@]} != 1 )); then
            echo "::error::Expected one app in the OTA ZIP."
            exit 1
          fi
          for app in "${apps[0]}" "${ota_apps[0]}"; do
            codesign --verify --deep --strict "$app"
            plutil -convert xml1 -o - "$app/Contents/Info.plist" > "$RUNNER_TEMP/Info.plist"
            codesign -dv --verbose=2 "$app" > "$RUNNER_TEMP/codesign.txt" 2>&1 || true
            node scripts/fork-mac-identity.ts \
              --info-plist "$RUNNER_TEMP/Info.plist" \
              --codesign "$RUNNER_TEMP/codesign.txt" \
              --release-version "$VERSION" \
              --app-update-yml "$app/Contents/Resources/app-update.yml" \
              --release-dir release
          done

      - name: Attest DMG provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release/T3-Code-${{ needs.guard.outputs.version }}-arm64.dmg
            release/T3-Code-${{ needs.guard.outputs.version }}-arm64.zip
            release/T3-Code-${{ needs.guard.outputs.version }}-arm64.*.blockmap
            release/atli-mac.yml

      # publish downloads every `release-*` artifact into one directory.
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: release-darwin-arm64
          path: |
            release/T3-Code-${{ needs.guard.outputs.version }}-arm64.dmg
            release/T3-Code-${{ needs.guard.outputs.version }}-arm64.zip
            release/T3-Code-${{ needs.guard.outputs.version }}-arm64.*.blockmap
            release/atli-mac.yml
          if-no-files-found: error
          retention-days: 7

  mobile-plan:
    name: Plan mobile delivery from distributed baselines
    needs: guard
    if: github.repository_id == '1406026313' && github.ref == 'refs/heads/atli'
    runs-on: ${{ matrix.platform == 'android' && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-12vcpu-macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    environment: ${{ matrix.platform == 'android' && 'personal-android-signing' || 'personal-ios-signing' }}
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
      actions: read
    env:
      APP_VARIANT: personal
      T3CODE_MOBILE_CHANNEL: personal-production
      SKALD_EAS_READY: ${{ vars.SKALD_EAS_READY }}
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.guard.outputs.sha }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/setup-mobile-worker
        with:
          platform: ${{ matrix.platform }}

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 27.5.0
          token: ${{ secrets.EXPO_OTA_TOKEN }}
          packager: npm

      - name: Resolve native compatibility and Apple availability
        id: plan
        env:
          PLATFORM: ${{ matrix.platform }}
          FORCE_NATIVE: ${{ inputs.force-native }}
          SKALD_ASC_APP_ID: ${{ vars.SKALD_ASC_APP_ID }}
          ASC_KEY_ID: ${{ vars.T3CODE_IOS_APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.T3CODE_IOS_APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.T3CODE_IOS_APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          node scripts/fork-mobile-release.ts prepare --platform "$PLATFORM" --sha "$SHA" --tag "$TAG" --force "$FORCE_NATIVE" --out "$RUNNER_TEMP/$PLATFORM-intent.json"

      - name: Save immutable delivery intent
        uses: actions/upload-artifact@v7
        with:
          name: mobile-intent-${{ matrix.platform }}
          path: ${{ runner.temp }}/${{ matrix.platform }}-intent.json
          if-no-files-found: error

  build-android:
    name: Build or reference personal Android APK
    needs: [guard, mobile-plan]
    if: github.repository_id == '1406026313' && github.ref == 'refs/heads/atli'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    environment: personal-android-signing
    timeout-minutes: 150
    permissions:
      contents: read
      deployments: write
      actions: read
    env:
      APP_VARIANT: personal
      T3CODE_MOBILE_CHANNEL: personal-production
      SKALD_EAS_READY: ${{ vars.SKALD_EAS_READY }}
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.guard.outputs.sha }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/setup-mobile-worker
        with:
          platform: android

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 27.5.0
          token: ${{ secrets.EXPO_OTA_TOKEN }}
          packager: npm

      - name: Download delivery intent
        uses: actions/download-artifact@v8
        with:
          pattern: mobile-intent-*
          merge-multiple: true
          path: ${{ runner.temp }}

      - name: Assemble platform intents
        run: node scripts/fork-mobile-release.ts assemble --tag "$TAG" --dir "$RUNNER_TEMP" --out "$RUNNER_TEMP/mobile-intent.json"

      - name: Check public config
        run: |
          (cd apps/mobile && eas env:exec production 'vp exec expo config --type public --json' --non-interactive) > "$RUNNER_TEMP/expo-config.json"
          node scripts/fork-android-config.ts --config "$RUNNER_TEMP/expo-config.json"

      - name: Check APK identity
        id: native
        run: node scripts/fork-mobile-release.ts android --sha "$SHA" --tag "$TAG" --intent "$RUNNER_TEMP/mobile-intent.json" --dir "$RUNNER_TEMP/release-android"

      - name: Retain verified native bytes
        if: steps.native.outputs.upload-native == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.native.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/release-android/*.apk
            ${{ runner.temp }}/release-android/baseline.json
          if-no-files-found: error
          retention-days: 90

      - name: Record durable native provenance
        if: steps.native.outputs.native == 'true'
        run: node scripts/fork-mobile-release.ts register-native --platform android --sha "$SHA" --tag "$TAG" --dir "$RUNNER_TEMP/release-android" --intent "$RUNNER_TEMP/mobile-intent.json"

      - name: Upload newly verified APK
        if: steps.native.outputs.native == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-android-arm64-v8a
          path: ${{ runner.temp }}/release-android/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Save verified mobile intent
        uses: actions/upload-artifact@v7
        with:
          name: mobile-intent-verified
          path: ${{ runner.temp }}/mobile-intent.json
          if-no-files-found: error
          retention-days: 7

  # Installs the built archive over a T3 home the prior release migrated and
  # seeded, upgrades and runs it, and reads the seeded threads back through the
  # candidate. Writes ADMISSION.json only when every check passed, so a failed
  # admission publishes nothing. Verifiers: scripts/linux-admission/.
  admission:
    name: Admit Linux server upgrade
    needs: [guard, build-linux]
    if: github.repository_id == '1406026313'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install sqlite3
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sqlite3 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y sqlite3
          fi
          sqlite3 --version

      - name: Download archive
        uses: actions/download-artifact@v8
        with:
          name: release-linux-x64
          path: ${{ runner.temp }}/candidate

      - name: Choose the release to upgrade from
        id: prior
        env:
          BOOTSTRAP: ${{ inputs.admission-bootstrap-prior }}
        run: node scripts/linux-admission/prior-release.ts --repo "$GH_REPO" --release-version "$VERSION" --bootstrap "$BOOTSTRAP"

      - name: Upgrade from the prior release and check the candidate
        env:
          CANDIDATE_ARCHIVE: ${{ runner.temp }}/candidate/t3-${{ needs.guard.outputs.version }}-linux-x64.tar.gz
          EXPECTED_SHA256: ${{ needs.build-linux.outputs.archive-sha256 }}
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
          PRIOR_VERSION: ${{ steps.prior.outputs.version }}
          PRIOR_SOURCE: ${{ steps.prior.outputs.source }}
          VERIFIER_COMMIT: ${{ needs.guard.outputs.sha }}
          WORKDIR: ${{ runner.temp }}/admission
          OUT_DIR: ${{ runner.temp }}/admission-record
        run: bash scripts/linux-admission/run-admission.sh

      # Not a `release-*` artifact: publish downloads it into release/ before
      # the manifest step, which leaves it out of SHA256SUMS and the assets
      # and records the Linux archive as runtime-verified only if it matches.
      - name: Upload admission record
        uses: actions/upload-artifact@v7
        with:
          name: admission
          path: ${{ runner.temp }}/admission-record/ADMISSION.json
          if-no-files-found: error
          retention-days: 7

  # Every package's tests on the guarded commit. Pull requests into atli run
  # only the tests the fork added or changed (fork-ci.yml).
  test-full:
    name: Full test suite
    needs: guard
    uses: ./.github/workflows/fork-full-suite.yml
    with:
      ref: ${{ needs.guard.outputs.sha }}

  # Upload to a draft so update clients never see an incomplete release.
  # A failed run needs a new version; published releases never change.
  publish:
    name: Publish release
    needs: [guard, build-linux, admission, build-mac, build-android, test-full]
    if: github.repository_id == '1406026313'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.guard.outputs.sha }}
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download archive, desktop update assets, and APK
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Download admission record
        uses: actions/download-artifact@v8
        with:
          name: admission
          path: release

      # manifest.json's verificationScope: Linux x64 runtime-verified by
      # ADMISSION.json, Mac and Android build-checked but runtime-unverified
      # (owner decision of 2026-10-06). Writes nothing if the evidence differs.
      - name: Download verified mobile intent
        uses: actions/download-artifact@v8
        with:
          name: mobile-intent-verified
          path: ${{ runner.temp }}

      - name: Write SHA256SUMS and manifest.json
        run: |
          node scripts/fork-release-manifest.ts --dir release --commit "$SHA" --release-version "$VERSION" --admission release/ADMISSION.json --mobile-intent "$RUNNER_TEMP/mobile-intent.json"
          cat release/SHA256SUMS release/manifest.json

      # Only a refusal guard: the evidence verdict is an independent reader
      # running the same checker on the published release.
      - name: Check the verification scope against ADMISSION.json
        run: node scripts/fork-release-scope.ts --manifest release/manifest.json --admission release/ADMISSION.json

      - name: Attest SHA256SUMS, manifest.json, and ADMISSION.json provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release/SHA256SUMS
            release/manifest.json
            release/ADMISSION.json

      # Under RUNNER_TEMP, not release/: every file in release/ is published.
      - name: Write release notes
        run: node scripts/fork-release-notes.ts --manifest release/manifest.json --out "$RUNNER_TEMP/release-notes.md"

      # Tags created with GITHUB_TOKEN start no other workflows.
      - name: Create tag and release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" release/* \
            --target "$SHA" \
            --draft --prerelease \
            --title "Skald Code $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --draft=false

  mobile-delivery:
    name: Deliver mobile from the published release
    needs: [guard, publish]
    if: github.repository_id == '1406026313' && github.ref == 'refs/heads/atli'
    permissions:
      contents: read
      deployments: write
      actions: read
    uses: ./.github/workflows/fork-mobile-delivery.yml
    with:
      tag: ${{ needs.guard.outputs.tag }}
    secrets: inherit
