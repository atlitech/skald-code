name: Retry fork mobile delivery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published fork release tag to resume (exact manifest SHA)"
        type: string
        required: true
      rebuild-native:
        description: "Reserve a new iOS number if retained bytes were lost (never after an ambiguous upload)"
        type: boolean
        default: false

concurrency:
  group: skald-production-publication
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  actions: read

jobs:
  retry:
    if: github.repository_id == '1406026313' && github.ref == 'refs/heads/atli'
    uses: ./.github/workflows/fork-mobile-delivery.yml
    with:
      tag: ${{ inputs.tag }}
      rebuild-native: ${{ inputs.rebuild-native }}
    secrets: inherit
